<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Get hourly weather forecasts for any location worldwide">
    <title>Hourly Weather Forecast</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1>🌤️ Hourly Weather Forecast</h1>
            <p class="subtitle">Get detailed hourly weather information for any location</p>
        </header>

        <!-- Search Section -->
        <section class="search-section">
            <div class="search-container">
                <input 
                    type="text" 
                    id="locationInput" 
                    class="location-input"
                    placeholder="Enter city name, ZIP code, or coordinates..."
                    aria-label="Location input"
                />
                <button 
                    id="geolocateBtn" 
                    class="btn btn-geolocation"
                    title="Use my current location"
                    aria-label="Use my current location"
                >
                    📍
                </button>
                <button 
                    id="searchBtn" 
                    class="btn btn-search"
                    aria-label="Search weather"
                >
                    Search
                </button>
            </div>
            
            <!-- Messages -->
            <div id="messageContainer" class="message-container"></div>
        </section>

        <!-- Loading Spinner -->
        <div id="loadingSpinner" class="loading-spinner hidden">
            <div class="spinner"></div>
            <p>Loading weather data...</p>
        </div>

        <!-- Location Display -->
        <div id="locationDisplay" class="location-display hidden"></div>

        <!-- Hourly Forecast Section -->
        <section id="forecastSection" class="forecast-section hidden">
            <h2 class="forecast-title">24-Hour Forecast</h2>
            <div id="forecastContainer" class="forecast-container"></div>
        </section>

        <!-- Footer -->
        <footer class="footer">
            <p>Built by <strong>Biswajit Das</strong></p>
            <p>Powered by <a href="https://www.weatherapi.com/" target="_blank" rel="noopener">WeatherAPI.com</a></p>
            <p class="footer-note">Data updates every hour</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
